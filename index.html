<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utrudnienia ZG — utrudnienia drogowe w Zielonej Górze</title>
<meta name="description" content="Aktualne remonty, objazdy i zmiany tras MZK w Zielonej Górze w jednym miejscu.">
<meta name="theme-color" content="#2C2C2A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<style>
  :root{
    --surface-0:#F1EFE8;
    --surface-1:#FFFFFF;
    --surface-2:#FFFFFF;
    --text-primary:#2C2C2A;
    --text-secondary:#5F5E5A;
    --text-muted:#888780;
    --border:#E4E2D9;
    --border-strong:#D3D1C7;
    --accent-bg:#E6F1FB; --accent-text:#0C447C;
    --warning-bg:#FAEEDA; --warning-text:#854F0B;
    --danger-bg:#FCEBEB;  --danger-text:#A32D2D;
    --prad-bg:#FDF4DC;    --prad-text:#8A5A00;
    --fact-bg:#EFE6FB;    --fact-text:#5B3A9E;
    --header-bg:#2C2C2A;
    --header-accent:#1B5E20;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface-0:#1C1C1A; --surface-1:#2C2C2A; --surface-2:#2C2C2A;
      --text-primary:#F1EFE8; --text-secondary:#B4B2A9; --text-muted:#888780;
      --border:#444441; --border-strong:#5F5E5A;
      --accent-bg:#1E3A52; --accent-text:#7FBFF5;
      --prad-bg:#4A3A0F; --prad-text:#F5CB5C;
      --fact-bg:#3B2A5C; --fact-text:#C4A6F5;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--surface-0);color:var(--text-primary);-webkit-tap-highlight-color:transparent;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:24px;}
  header{background:var(--header-bg);padding:max(20px,env(safe-area-inset-top)) 20px 16px;position:sticky;top:0;z-index:10;}
  .header-row{display:flex;align-items:center;justify-content:space-between;}
  .notify-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;}
  .notify-btn:active{transform:scale(0.94);}
  .notify-btn.active{background:var(--prad-bg);color:var(--prad-text);}
  .notify-panel{background:var(--surface-1);border-bottom:1px solid var(--border);padding:16px 20px;}
  .notify-panel.hidden{display:none;}
  .notify-panel-title{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--text-primary);}
  .notify-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px;color:var(--text-primary);cursor:pointer;}
  .notify-row input{width:17px;height:17px;flex-shrink:0;}
  .notify-row-master{font-weight:600;border-bottom:1px solid var(--border);margin-bottom:6px;padding-bottom:10px;}
  .notify-categories{padding-left:4px;}
  .notify-categories.disabled{opacity:0.4;pointer-events:none;}
  .notify-status{margin:8px 0 0;font-size:12.5px;color:var(--text-muted);min-height:16px;}
  .notify-actions{display:flex;gap:8px;margin-top:12px;}
  .notify-save{flex:1;background:var(--header-accent);color:#fff;border:none;border-radius:10px;padding:10px;font-weight:600;font-size:13.5px;cursor:pointer;}
  .notify-cancel{background:transparent;color:var(--text-secondary);border:1px solid var(--border-strong);border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-icon{width:34px;height:34px;border-radius:8px;background:var(--header-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-icon i{font-size:19px;color:#412402;}
  .brand-title{margin:0;font-size:16px;font-weight:600;color:#fff;}
  .brand-sub{margin:0;font-size:12px;color:#B4B2A9;}
  .filters{display:flex;gap:8px;padding:14px 20px;background:var(--surface-1);overflow-x:auto;}
  .category-desc{margin:0;padding:0 20px 14px;font-size:12.5px;line-height:1.4;color:var(--text-muted);background:var(--surface-1);}
  .chip{border:1px solid var(--border-strong);background:var(--surface-0);color:var(--text-secondary);font-size:13px;padding:6px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;flex-shrink:0;font-weight:500;}
  .chip.active{background:var(--header-bg);color:#fff;border-color:var(--header-bg);}
  #list{background:var(--surface-1);padding:0 16px 16px;min-height:200px;}
  .card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:12px;display:flex;gap:10px;transition:opacity .15s;}
  .card:active{opacity:0.75;}
  .card-icon{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .card-icon i{font-size:16px;}
  .card-title{margin:0;font-size:14px;font-weight:600;}
  .card-title-link{margin:0;font-size:14px;font-weight:600;color:var(--text-primary);text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:2px;}
  .card-title-link:active{opacity:0.7;}
  .card-date{font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;}
  .card-desc{margin:4px 0 0;font-size:13px;color:var(--text-secondary);line-height:1.5;}
  .card-desc.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .card-toggle{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--accent-text);cursor:pointer;user-select:none;}
  .card-toggle:active{opacity:0.7;}
  .card-more{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--accent-text);text-decoration:none;}
  .card-more:active{opacity:0.7;}
  .ad{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:12px;padding:14px 16px;margin-top:12px;text-align:center;}
  .ad-label{margin:0;font-size:11px;color:var(--text-muted);}
  .ad-body{margin:4px 0 0;font-size:13px;color:var(--text-secondary);}
  .empty{text-align:center;font-size:13px;color:var(--text-muted);padding:32px 0;}
  .skeleton{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--surface-0) 25%,var(--border) 50%,var(--surface-0) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;margin-top:12px;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-row">
      <div class="brand">
        <div class="brand-icon"><img src="icon-192.png" alt="" width="24" height="24" style="border-radius:5px;"></div>
        <div>
          <p class="brand-title">Utrudnienia ZG</p>
          <p class="brand-sub">Zielona Góra &middot; na żywo</p>
        </div>
      </div>
      <button id="notifyBtn" class="notify-btn" aria-label="Ustawienia powiadomień">
        <i class="ti ti-bell" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div id="notifyPanel" class="notify-panel hidden">
    <p class="notify-panel-title">Powiadomienia</p>
    <label class="notify-row notify-row-master">
      <input type="checkbox" id="notifyMaster">
      <span>Chcę otrzymywać powiadomienia</span>
    </label>
    <div id="notifyCategories" class="notify-categories">
      <label class="notify-row">
        <input type="checkbox" class="notify-cat" value="drogi" checked>
        <span>Drogi</span>
      </label>
      <label class="notify-row">
        <input type="checkbox" class="notify-cat" value="mzk" checked>
        <span>MZK</span>
      </label>
      <label class="notify-row">
        <input type="checkbox" class="notify-cat" value="wodociagi" checked>
        <span>Wodociągi</span>
      </label>
      <label class="notify-row">
        <input type="checkbox" class="notify-cat" value="prad" checked>
        <span>Prąd</span>
      </label>
    </div>
    <p id="notifyStatus" class="notify-status"></p>
    <div class="notify-actions">
      <button id="notifySave" class="notify-save">Zapisz</button>
      <button id="notifyClose" class="notify-cancel">Zamknij</button>
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="drogi">Drogi</button>
    <button class="chip" data-filter="mzk">MZK</button>
    <button class="chip" data-filter="wodociagi">Wodociągi</button>
    <button class="chip" data-filter="prad">Prąd</button>
    <button class="chip" data-filter="ciekawostka">Ciekawostka</button>
  </div>
  <p id="categoryDesc" class="category-desc"></p>

  <div id="list"></div>
</div>

<script>
// Podmień na adres własnego backendu po wdrożeniu (patrz README).
const API_BASE_URL = window.location.hostname === 'localhost'
  ? 'http://localhost:3000'
  : 'https://objazdy-zg-backend1.onrender.com';

const CATEGORY_STYLE = {
  drogi:       {bg:'var(--warning-bg)', text:'var(--warning-text)', icon:'ti-road-sign'},
  mzk:         {bg:'var(--accent-bg)',  text:'var(--accent-text)',  icon:'ti-bus'},
  wodociagi:   {bg:'var(--danger-bg)',  text:'var(--danger-text)',  icon:'ti-droplet'},
  prad:        {bg:'var(--prad-bg)',    text:'var(--prad-text)',    icon:'ti-bolt'},
  ciekawostka: {bg:'var(--fact-bg)',    text:'var(--fact-text)',    icon:'ti-bulb'},
};

const CATEGORY_DESC = {
  drogi:       'Remonty, objazdy, zamknięcia ulic i zmiany w organizacji ruchu drogowego w Zielonej Górze (ZDW, Urząd Miasta).',
  mzk:         'Zmiany tras, objazdy linii i inne komunikaty Miejskiego Zakładu Komunikacji w Zielonej Górze.',
  wodociagi:   'Planowane i awaryjne przerwy w dostawie wody oraz prace na sieci wodociągowo-kanalizacyjnej.',
  prad:        'Planowane wyłączenia prądu w Zielonej Górze i okolicy (Enea Operator).',
  ciekawostka: 'Jedna nowa ciekawostka dziennie o historii, tradycji i przyrodzie Zielonej Góry i okolic.',
};

const FALLBACK_DATA = [
  {id:'fallback-1',category:'drogi',street:'Sprawdź stronę Urzędu Miasta',published_at:new Date().toISOString(),description:'Nie udało się pobrać najnowszych danych. Połącz się z internetem i odśwież.'},
];

// Sprawdzone ciekawostki o Zielonej Gorze i okolicach (historia, tradycja
// winiarska, przyroda, ludzie). Jedna dziennie, wybierana rotacyjnie wg dnia
// roku - bez zaleznosci od zewnetrznych, kruchych zrodel do scrapowania.
const CIEKAWOSTKI = [
  'Zielona Góra po raz pierwszy pojawia się w źródłach historycznych w 1222 roku, choć pierwsze osady rolnicze na tym terenie powstały już w X wieku.',
  'Miasto bywa nazywane „Winnym Grodem" lub „Grodem Bachusa" – winorośl uprawiano tu już w średniowieczu, a pierwsza udokumentowana wzmianka o winnicach pochodzi z 1314 roku.',
  'Według lokalnej legendy tradycja winiarska Zielonej Góry zaczęła się od kropli krwi boga Bachusa, którą bogini Atena rozsiała po najlepszych terenach winiarskich świata.',
  'Krzewy winorośli sprowadzili na te tereny osadnicy z Flandrii, którzy przybyli tu około 1150 roku.',
  'Pod koniec XVIII wieku w Zielonej Górze działało 48 mistrzów winiarskich, a uprawy winorośli zajmowały około 700 hektarów.',
  'Winobranie obchodzone jest w Zielonej Górze od ponad 150 lat – od 1852 roku patronat nad świętem sprawuje oficjalnie Rada Miejska.',
  'Pierwsze powojenne Winobranie odbyło się już we wrześniu 1945 roku, zaledwie kilka miesięcy po przejęciu miasta przez polską administrację.',
  'Latem 1945 roku, gdy Polacy przejmowali Zieloną Górę, miasto liczyło zaledwie około sześciu tysięcy mieszkańców, a wokół niego rosło 28 hektarów winnic.',
  'Na przełomie XIX i XX wieku, gdy sprzedaż wina zaczęła słabnąć, część zielonogórskich producentów przestawiła się na wyrób koniaków.',
  'Zielonogórski „szampan" produkowano początkowo wcale nie z winogron, lecz z jabłek, według receptury opracowanej w Jeleniej Górze.',
  'Konkatedra świętej Jadwigi Śląskiej, zbudowana w XIII wieku, jest najstarszym zachowanym zabytkiem Zielonej Góry.',
  'Zielonogórski ratusz wzniesiono w XV wieku w stylu gotyckim, a swój obecny, klasycystyczny wygląd zawdzięcza przebudowom z XIX stulecia.',
  'Przy placu Pocztowym stoi Wieża Głodowa, zwana też Łazienną – jeden z najstarszych elementów miejskich fortyfikacji, pochodzący z XV wieku.',
  'Ponieważ Zielona Góra została mocno zniszczona podczas II wojny światowej, w mieście zachowało się stosunkowo niewiele przedwojennych zabytków.',
  'Niemal połowa powierzchni Zielonej Góry to tereny zielone – parki, lasy i skwery.',
  'W zielonogórskiej Palmiarni, pod szklanym dachem, rośnie ponad 200 gatunków roślin tropikalnych i subtropikalnych.',
  'Zielona Góra bywa nazywana „miastem srok" – żyje tu ponad 700 par tych ptaków, co czyni ją prawdopodobnie miastem o jednym z najwyższych zagęszczeń populacji srok na świecie.',
  'Z Zielonej Góry pochodzi piosenkarka Maryla Rodowicz, jedna z najbardziej rozpoznawalnych artystek polskiej sceny muzycznej.',
  'Dziennikarz Tomasz Lis, znany z polskiej telewizji, urodził się właśnie w Zielonej Górze.',
  'W 2003 roku Zielona Góra, Sulechów i Nowa Sól postanowiły współpracować jako tzw. Lubuskie Trójmiasto – porozumienie podpisano rok później.',
  'Powierzchnia Zielonej Góry wynosi 278,32 km² – pod tym względem miasto zajmuje szóste miejsce w Polsce, ustępując tylko Warszawie, Krakowowi, Szczecinowi, Łodzi i Wrocławiowi.',
  'Choć Zielona Góra jest szóstym co do wielkości powierzchni miastem w Polsce, pod względem liczby mieszkańców plasuje się dopiero w trzeciej dziesiątce.',
  'Od 1999 roku Zielona Góra jest, obok Gorzowa Wielkopolskiego, jedną z dwóch stolic województwa lubuskiego.',
  'Uniwersytet Zielonogórski działa od 2001 roku i jest jednym z ważniejszych ośrodków akademickich w zachodniej Polsce.',
  'Liczba mieszkańców Zielonej Góry przekroczyła 100 tysięcy w latach 80. XX wieku.',
  'W 1871 roku przez Zieloną Górę poprowadzono linię kolejową łączącą Wrocław ze Szczecinem, co znacząco przyspieszyło rozwój miasta jako ośrodka przemysłowego.',
  'Park Książęcy w Zatoniu pod Zieloną Górą został wyróżniony w plebiscycie National Geographic Traveler „Cuda Polski 2023".',
  'Historyczny hymn zielonogórskiego Winobrania – „Walc winobraniowy" – nagrano po raz pierwszy w 1961 roku.',
  'W czasie Winobrania mieszkańcy symbolicznie przekazują Bachusowi, bogu wina, klucze do miasta na czas trwania święta.',
  'W XIX wieku Zielona Góra była ważnym ośrodkiem sukiennictwa – produkcji i handlu tkaninami – co przyczyniło się do jej rozwoju gospodarczego.',
];

function factOfTheDay(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return CIEKAWOSTKI[dayOfYear % CIEKAWOSTKI.length];
}

let filter = 'drogi';
let currentItems = [];

const list = document.getElementById('list');
const categoryDesc = document.getElementById('categoryDesc');

function showSkeleton(){
  list.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
}

async function loadData(){
  if(filter === 'ciekawostka'){
    await renderCiekawostka();
    return;
  }
  showSkeleton();
  try{
    const params = new URLSearchParams();
    params.set('category', filter);
    const res = await fetch(`${API_BASE_URL}/api/utrudnienia?${params}`);
    if(!res.ok) throw new Error('bad response');
    const json = await res.json();
    currentItems = json.items.map(i => ({
      id: i.id,
      category: i.category,
      street: i.street || i.title,
      source_url: i.source_url,
      published_at: i.published_at,
      description: i.description,
    }));
  }catch(err){
    console.warn('Nie udalo sie pobrac danych z API, pokazuje dane zapasowe.', err);
    currentItems = FALLBACK_DATA.filter(d => d.category === filter);
  }
  render();
}

async function renderCiekawostka(){
  categoryDesc.textContent = CATEGORY_DESC.ciekawostka;
  const style = CATEGORY_STYLE.ciekawostka;
  const today = new Date().toLocaleDateString('pl-PL', {day:'numeric', month:'long', year:'numeric'});
  showSkeleton();

  let content = factOfTheDay();
  try{
    const res = await fetch(`${API_BASE_URL}/api/ciekawostka`);
    if(!res.ok) throw new Error('bad response');
    const json = await res.json();
    if(json.content) content = json.content;
  }catch(err){
    console.warn('Nie udalo sie pobrac ciekawostki z API, pokazuje lokalna.', err);
  }

  list.innerHTML = `
    <div class="card">
      <div class="card-icon" style="background:${style.bg};">
        <i class="ti ${style.icon}" style="color:${style.text};" aria-hidden="true"></i>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <p class="card-title">Ciekawostka dnia</p>
          <span class="card-date">${today}</span>
        </div>
        <p class="card-desc">${content}</p>
      </div>
    </div>`;
}

function formatDate(iso){
  try{ return new Date(iso).toLocaleDateString('pl-PL',{day:'numeric',month:'long'}); }
  catch(e){ return ''; }
}

function render(){
  const items = currentItems;
  list.innerHTML = '';
  categoryDesc.textContent = CATEGORY_DESC[filter] || CATEGORY_DESC.all;

  if(items.length === 0){
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = 'Brak zgłoszonych utrudnień w tej kategorii.';
    list.appendChild(empty);
  }

  items.forEach((d, i) => {
    const style = CATEGORY_STYLE[d.category] || CATEGORY_STYLE.drogi;
    const card = document.createElement('div');
    card.className = 'card';
    const titleHtml = d.source_url
      ? `<a class="card-title-link" href="${d.source_url}" target="_blank" rel="noopener">${d.street || 'Zielona Góra'}</a>`
      : `<p class="card-title">${d.street || 'Zielona Góra'}</p>`;
    const desc = d.description || '';
    const isLong = desc.length > 140;
    card.innerHTML = `
      <div class="card-icon" style="background:${style.bg};">
        <i class="ti ${style.icon}" style="color:${style.text};" aria-hidden="true"></i>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          ${titleHtml}
          <span class="card-date">${formatDate(d.published_at)}</span>
        </div>
        <p class="card-desc${isLong ? ' clamped' : ''}">${desc}</p>
        ${isLong ? '<span class="card-toggle">Pokaż więcej ▾</span>' : ''}
      </div>`;
    list.appendChild(card);

    if(isLong){
      const toggle = card.querySelector('.card-toggle');
      const descEl = card.querySelector('.card-desc');
      toggle.addEventListener('click', () => {
        const stillClamped = descEl.classList.toggle('clamped');
        toggle.textContent = stillClamped ? 'Pokaż więcej ▾' : 'Zwiń ▴';
      });
    }

    if((i + 1) % 2 === 0 && i !== items.length - 1){
      const ad = document.createElement('div');
      ad.className = 'ad';
      ad.innerHTML = `<p class="ad-label">Reklama</p><p class="ad-body">Miejsce na reklamę lokalnej firmy</p>`;
      list.appendChild(ad);
    }
  });
}

document.querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    loadData();
  });
});

// Jednorazowo czyscimy pozostalosci po starym, zepsutym Service Workerze
// (jesli u kogos jeszcze siedzi z wczesniejszej wersji appki), po czym
// rejestrujemy nowy, minimalny SW - sluzacy WYLACZNIE do powiadomien push,
// bez zadnego cache'owania stron.
if('caches' in window){
  caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW blad:', err));
}

// --- Powiadomienia push ---

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

const notifyBtn = document.getElementById('notifyBtn');
const notifyPanel = document.getElementById('notifyPanel');
const notifyMaster = document.getElementById('notifyMaster');
const notifyCategoriesEl = document.getElementById('notifyCategories');
const notifyStatus = document.getElementById('notifyStatus');
const notifySave = document.getElementById('notifySave');
const notifyClose = document.getElementById('notifyClose');

function loadNotifyPrefs(){
  try{
    const raw = localStorage.getItem('notifyPrefs');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function saveNotifyPrefsLocal(prefs){
  localStorage.setItem('notifyPrefs', JSON.stringify(prefs));
}

function applyPrefsToUI(prefs){
  const enabled = !!(prefs && prefs.enabled);
  notifyMaster.checked = enabled;
  notifyCategoriesEl.classList.toggle('disabled', !enabled);
  const cats = (prefs && prefs.categories) || [];
  document.querySelectorAll('.notify-cat').forEach(cb => {
    cb.checked = cats.length === 0 ? true : cats.includes(cb.value);
  });
  notifyBtn.classList.toggle('active', enabled);
}

applyPrefsToUI(loadNotifyPrefs());

notifyBtn.addEventListener('click', () => {
  notifyPanel.classList.toggle('hidden');
});
notifyClose.addEventListener('click', () => {
  notifyPanel.classList.add('hidden');
});

notifyMaster.addEventListener('change', () => {
  notifyCategoriesEl.classList.toggle('disabled', !notifyMaster.checked);
});

notifySave.addEventListener('click', async () => {
  const enabled = notifyMaster.checked;
  const allCats = [...document.querySelectorAll('.notify-cat')];
  const checkedCats = allCats.filter(cb => cb.checked).map(cb => cb.value);
  // Jesli zaznaczone sa wszystkie kategorie, zapisujemy pusta liste
  // (backend traktuje to jako "wszystkie", co jest odporne na dodanie
  // nowej kategorii w przyszlosci).
  const categories = checkedCats.length === allCats.length ? [] : checkedCats;

  if(!enabled){
    saveNotifyPrefsLocal({ enabled: false, categories });
    applyPrefsToUI({ enabled: false, categories });
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && await reg.pushManager.getSubscription();
      if(sub){
        await fetch(`${API_BASE_URL}/api/push/unsubscribe`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ endpoint: sub.endpoint }),
        });
        await sub.unsubscribe();
      }
    }catch(e){ console.warn('Blad przy wypisywaniu z powiadomien:', e); }
    notifyStatus.textContent = 'Powiadomienia wyłączone.';
    return;
  }

  if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)){
    notifyStatus.textContent = 'Ta przeglądarka nie obsługuje powiadomień push.';
    return;
  }

  notifyStatus.textContent = 'Włączam powiadomienia…';
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      notifyStatus.textContent = 'Musisz zezwolić na powiadomienia w przeglądarce.';
      return;
    }

    const keyRes = await fetch(`${API_BASE_URL}/api/push/vapid-public-key`);
    if(!keyRes.ok) throw new Error('Serwer nie ma jeszcze skonfigurowanych powiadomień');
    const { publicKey } = await keyRes.json();

    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
    }

    await fetch(`${API_BASE_URL}/api/push/subscribe`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ endpoint: sub.endpoint, subscription: sub.toJSON(), categories }),
    });

    saveNotifyPrefsLocal({ enabled: true, categories });
    applyPrefsToUI({ enabled: true, categories });
    notifyStatus.textContent = 'Gotowe! Będziesz dostawać powiadomienia.';
  }catch(err){
    console.error('Blad wlaczania powiadomien:', err);
    notifyStatus.textContent = 'Coś poszło nie tak. Spróbuj ponownie.';
  }
});

loadData();
</script>
</body>
</html>
